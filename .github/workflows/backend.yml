name: Backend tests

on:
  push:
    branches: [main]
    paths: ["ijario-backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["ijario-backend/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ijario-backend/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ijario-backend/backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
