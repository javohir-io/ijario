services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ijario
      POSTGRES_PASSWORD: ijario_secret
      POSTGRES_DB: ijario
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432" # host:container — avoids clashing with a local Postgres on 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ijario -d ijario"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    # .env is optional: without it the built-in defaults match the db service
    # below, so `docker compose up --build` works on a fresh checkout.
    # Copy backend/.env.example to backend/.env only to change settings.
    env_file:
      - path: ./backend/.env
        required: false
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  db_data:
